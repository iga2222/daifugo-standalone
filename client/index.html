<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#07271e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="大富豪" />
    <meta name="description" content="最大6人で遊べるトランプゲーム「大富豪」。オンライン対戦・CPU対戦対応。" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/icon-32.png" />
    <!-- client/build.mjs rewrites this href in the built index.html to
         /apple-touch-icon-v2.png — a fixed root path no older icon ever
         used, so iOS / intermediary caches keyed to a previous icon URL
         cannot serve a stale icon. The server answers that path (and the
         classic /apple-touch-icon.png) with the current 180px icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./src/assets/icon-180.png" />
    <title>大富豪</title>
    <script src="./src/main.tsx" type="module"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
