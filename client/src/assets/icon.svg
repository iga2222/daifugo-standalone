<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Daifugo PWA icon (original): deep-green felt, gold double frame,
       a fan of three white cards and a gold crown. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="82%">
      <stop offset="0%" stop-color="#1d814f"/>
      <stop offset="45%" stop-color="#0d5a37"/>
      <stop offset="76%" stop-color="#073e26"/>
      <stop offset="100%" stop-color="#03231a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffec8f"/>
      <stop offset="55%" stop-color="#edb93f"/>
      <stop offset="100%" stop-color="#b9822e"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="106"/>
    </clipPath>
    <path id="heart" d="M0 17 C -3 8 -21 -1 -21 -13 C -21 -23 -13 -28 -6.5 -28 C -2.5 -28 0 -24.5 0 -20 C 0 -24.5 2.5 -28 6.5 -28 C 13 -28 21 -23 21 -13 C 21 -1 3 8 0 17 Z"/>
    <path id="spade" d="M0 -17 C -3 -8 -21 1 -21 13 C -21 23 -13 28 -6.5 28 C -2.5 28 0 24.5 0 20 C 0 24.5 2.5 28 6.5 28 C 13 28 21 23 21 13 C 21 1 3 -8 0 -17 Z M -8 40 L 0 25 L 8 40 L 11 46 L -11 46 Z"/>
    <g id="club">
      <circle cx="0" cy="-13" r="12.5"/>
      <circle cx="-12.5" cy="6" r="12.5"/>
      <circle cx="12.5" cy="6" r="12.5"/>
      <path d="M -6 34 L 0 11 L 6 34 L 9.5 41 L -9.5 41 Z"/>
    </g>
    <g id="card">
      <rect x="167" y="162" width="178" height="266" rx="20" fill="#ffffff" stroke="#c6ccc7" stroke-width="2.5"/>
    </g>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
    <!-- gold double frame -->
    <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#d4af37" stroke-width="6"/>
    <rect x="39" y="39" width="436" height="436" rx="76" fill="none" stroke="#ffd873" stroke-width="2.5" opacity="0.85"/>

    <!-- fan of cards (pivot 256,428) -->
    <g transform="rotate(-20 256 428)">
      <use href="#card"/>
      <use href="#spade" transform="translate(210 224) scale(1.05)" fill="#23272e"/>
    </g>
    <g transform="rotate(20 256 428)">
      <use href="#card"/>
      <use href="#club" transform="translate(302 220) scale(1.05)" fill="#23272e"/>
    </g>
    <!-- centre card: red A + big heart -->
    <use href="#card"/>
    <text x="187" y="216" font-family="sans-serif" font-size="48" font-weight="700" fill="#d8261c">A</text>
    <use href="#heart" transform="translate(256 300) scale(2.55)" fill="#d8261c"/>

    <!-- gold crown perched on the fan -->
    <g stroke="#8a6414" stroke-width="3" stroke-linejoin="round">
      <path d="M180 154 L180 94 L224 130 L256 82 L288 130 L332 94 L332 154 Z" fill="url(#gold)"/>
      <circle cx="180" cy="86" r="11" fill="url(#gold)"/>
      <circle cx="256" cy="72" r="12" fill="url(#gold)"/>
      <circle cx="332" cy="86" r="11" fill="url(#gold)"/>
    </g>
    <rect x="180" y="154" width="152" height="18" rx="8" fill="#a87c22" stroke="#8a6414" stroke-width="2.5"/>
    <circle cx="256" cy="163" r="6.5" fill="#d8261c"/>
    <circle cx="216" cy="163" r="3.5" fill="#ffe9a8"/>
    <circle cx="296" cy="163" r="3.5" fill="#ffe9a8"/>
  </g>
</svg>
